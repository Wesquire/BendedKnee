name: BendedKnee
options:
  minimumXcodeGenVersion: 2.37.0
configs:
  Debug: debug
  Release: release
targets:
  BendedKnee:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BendedKnee/App
      - path: BendedKnee/Domain
      - path: BendedKnee/Features
      - path: BendedKnee/Models
        excludes:
          - AppState.swift
      - path: BendedKnee/Services
        excludes:
          - AngleCalculator.swift
    info:
      path: BendedKnee/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bendedknee.app
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    scheme:
      testTargets:
        - BendedKneeTests
        - BendedKneeUITests
  BendedKneeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BendedKneeTests
    dependencies:
      - target: BendedKnee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bendedknee.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
  BendedKneeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BendedKneeUITests
    dependencies:
      - target: BendedKnee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bendedknee.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        TEST_TARGET_NAME: BendedKnee
