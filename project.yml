name: BendedKnee
options:
  minimumXcodeGenVersion: 2.37.0
configs:
  Debug: debug
  Release: release
targets:
  BendedKnee:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BendedKnee/App
      - path: BendedKnee/Domain
      - path: BendedKnee/Features
      - path: BendedKnee/Models
        excludes:
          - AppState.swift
      - path: BendedKnee/Services
        excludes:
          - AngleCalculator.swift
      - path: BendedKnee/Resources/Assets.xcassets
    info:
      path: BendedKnee/Resources/Info.plist
      properties:
        UIBackgroundModes:
          - audio
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.drop.app
        PRODUCT_NAME: Drop
        PRODUCT_MODULE_NAME: BendedKnee
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    scheme:
      testTargets:
        - BendedKneeTests
        - BendedKneeUITests
  BendedKneeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BendedKneeTests
    dependencies:
      - target: BendedKnee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drop.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Drop.app/Drop
        BUNDLE_LOADER: $(TEST_HOST)
  BendedKneeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BendedKneeUITests
    dependencies:
      - target: BendedKnee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drop.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        TEST_TARGET_NAME: BendedKnee
